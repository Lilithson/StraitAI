<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StraitAI{% endblock %}</title>
  <style>
    :root { --ink:#13263f; --muted:#687991; --canvas:#f4f7fb; --panel:#fff; --line:#e3eaf2; --navy:#183960; --mint:#20b7aa; --danger:#b42e3d; } * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--canvas); font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; } header { padding:14px clamp(18px,5vw,60px); background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; gap:15px; } .brand { color:#fff; text-decoration:none; font-size:1.12rem; font-weight:800; }.brand span { display:inline-grid; place-items:center; width:25px; height:25px; margin-right:8px; border-radius:8px; background:var(--mint); color:#083e43; } nav { display:flex; align-items:center; gap:16px; } nav a,nav button { color:#d7e4f3; text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; } nav a:hover,nav button:hover { color:#fff; } .container { max-width:1200px; margin:0 auto; padding:34px clamp(18px,5vw,60px) 60px; }.eyebrow { color:var(--mint); font-weight:800; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; } h1 { margin:4px 0 8px; font-size:clamp(1.6rem,3vw,2.1rem); letter-spacing:-.04em; } h2 { margin:0; font-size:1rem; } .subhead { color:var(--muted); margin:0 0 26px; } .notice { margin:0 0 20px; padding:12px 14px; border:1px solid #bde8e3; border-radius:10px; background:#e8f8f5; color:#126c65; }.notice.error { border-color:#f0c8ce; background:#fdf0f2; color:var(--danger); } .button { display:inline-block; padding:9px 13px; border:0; border-radius:8px; background:var(--mint); color:#063e42; text-decoration:none; font-weight:800; cursor:pointer; }.button.secondary { background:#eaf0f7; color:#3d506c; } .card { padding:20px; border:1px solid var(--line); border-radius:13px; background:var(--panel); box-shadow:0 3px 14px rgba(27,50,85,.035); } .grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:13px; margin-bottom:20px; }.metric { font-size:1.65rem; font-weight:800; letter-spacing:-.04em; }.label { color:var(--muted); font-size:.78rem; font-weight:700; } .section { margin-top:20px; }.section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 0 10px; }.table-wrap { overflow-x:auto; }.table { width:100%; border-collapse:collapse; font-size:.86rem; }.table th,.table td { padding:10px 8px; text-align:left; border-bottom:1px solid var(--line); }.table th { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; }.empty { color:var(--muted); font-size:.87rem; padding:15px 0; } .form-card { max-width:660px; }.field { margin:0 0 15px; }.field label { display:block; margin-bottom:6px; font-size:.84rem; font-weight:750; }.field input:not([type=checkbox]),.field select,.field textarea { width:100%; padding:10px; border:1px solid #cbd6e2; border-radius:8px; font:inherit; background:#fff; }.field ul { margin:7px 0 0; padding-left:20px; color:var(--danger); font-size:.8rem; }.actions { display:flex; gap:10px; margin-top:22px; } @media (max-width:820px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } } @media (max-width:520px) { header { align-items:flex-start; flex-direction:column; }.grid { grid-template-columns:1fr; } }
  </style>
</head>
<body><header><a class="brand" href="/"><span>S</span>StraitAI</a><nav>{% if user.is_authenticated %}<a href="{% url 'academics:setup' %}">Academic setup</a><a href="{% url 'accounts:students' %}">Students</a><a href="{% url 'assessments:list' %}">Assessments</a><a href="/admin/">Admin</a><form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>{% else %}<a href="{% url 'accounts:login' %}">Sign in</a>{% endif %}</nav></header><main class="container">{% if messages %}{% for message in messages %}<div class="notice{% if message.tags == 'error' %} error{% endif %}">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body>
</html>
